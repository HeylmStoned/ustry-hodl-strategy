[package]
name = "ustry-hodl-strategy"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Oracle-free DeFindex strategy that holds Etherfuse USTRY. Yield is the issuer redemption NAV."
repository = "https://github.com/HeylmStoned/ustry-hodl-strategy"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
